services:
  gs_connector:
    build: .
    image: connector
    container_name: connector
    volumes:
      - ./app:/app
    network_mode: cosmos-project_pwnsat_default
    ports:
      - "1234:1234/udp"
      - "1235:1235"
    # devices:
    #   - "/dev/ttyACM0:/dev/ttyACM0"
    stdin_open: true
    tty: true